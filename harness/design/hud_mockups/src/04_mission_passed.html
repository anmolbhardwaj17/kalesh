<!doctype html>
<html><head><meta charset="utf-8"><title>Kalesh HUD 04 mission passed</title>
<link rel="stylesheet" href="hud.css">
<style>
  .card { position: absolute; left: 132px; top: 128px; width: 980px; }
  .chip { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 24px; line-height: 1;
    letter-spacing: 0.18em; color: var(--ink-dim); padding-top: 3px; }
  .chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--tint); box-shadow: 0 0 10px var(--tint); }
  .title-dev { white-space: nowrap; font-family: var(--display); font-size: 124px; line-height: 0.9; font-weight: 500; margin-top: 18px; }
  .title-en { font-family: var(--display); font-size: 40px; letter-spacing: 0.32em; color: var(--ink-dim); margin-top: 6px; }
  .passed { display: inline-flex; align-items: baseline; gap: 14px; margin-top: 26px; padding: 10px 22px 4px; border-radius: 8px;
    background: var(--tint); color: #08131f; font-family: var(--display); font-size: 46px; line-height: 1; letter-spacing: 0.14em;
    box-shadow: 0 0 40px rgba(90,174,255,0.45); }
  .passed span { font-size: 36px; letter-spacing: 0; }
  .stats { margin-top: 28px; width: 560px; border-top: 1px solid var(--hair); }
  .stats div { display: flex; justify-content: space-between; padding: 9px 0 7px; border-bottom: 1px solid var(--hair); font-size: 21px; }
  .stats div span:first-child { color: var(--ink-dim); }
  .stats div b { font-family: var(--display); font-weight: 500; font-size: 30px; line-height: 0.9; letter-spacing: 0.03em; }
  .stats .best { font-size: 15px; color: var(--cop); margin-left: 10px; font-family: var(--body); letter-spacing: 0.04em; }
  .stamps { display: flex; gap: 18px; margin-top: 26px; }
  .stamp { width: 112px; height: 132px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .stamp svg { position: absolute; inset: 0; }
  .stamp .t { position: relative; font-family: var(--display); font-size: 22px; line-height: 0.95; letter-spacing: 0.08em; color: #0d1a29; padding-top: 30px; }
  .stamp.off .t { color: var(--ink-dim); }
  .stamp .t small { display: block; font-family: var(--body); font-size: 13px; letter-spacing: 0; margin-top: 4px; opacity: 0.8; }
  .reward { position: absolute; left: 132px; bottom: 140px; display: flex; gap: 44px; align-items: flex-end; }
  .reward .cash { font-family: var(--display); font-size: 72px; line-height: 0.8; font-weight: 500; color: var(--ink); }
  .reward .cash small { display: block; font-family: var(--body); font-size: 16px; color: var(--ink-dim); letter-spacing: 0.06em; margin-bottom: 8px; }
  .next { position: absolute; right: 96px; bottom: 112px; display: flex; gap: 28px; align-items: center; font-size: 20px; font-weight: 600; }
  .next span { display: inline-flex; gap: 10px; align-items: center; }
</style></head>
<body class="lead-cop">
<div class="stage">
  <img class="bg" src="../../reference/mood_ito_chase.jpg" style="filter: saturate(.85) brightness(.92)">
  <div class="card-shade"></div>
  <div class="letterbox" style="top:0"></div>
  <div class="letterbox" style="bottom:0"></div>

  <div class="card shadow-text">
    <div class="chip"><i></i>ADHYAY 1 · THE COP · MISSION 2</div>
    <div class="title-dev">आईटीओ नाकाबंदी</div>
    <div class="title-en">BARRICADE AT ITO</div>
    <div class="passed">PASSED <span>सफल</span></div>
    <div class="stats">
      <div><span>Time</span><b>06:42<span class="best">NEW BEST</span></b></div>
      <div><span>Top speed</span><b>128 km/h</b></div>
      <div><span>Barricades called</span><b>2</b></div>
      <div><span>Civilians hurt</span><b>0</b></div>
      <div><span>Patrol car damage</span><b>34%</b></div>
    </div>
    <div class="stamps" id="stamps"></div>
  </div>

  <div class="reward shadow-text" style="left:auto; right:96px; bottom:200px; flex-direction:column; align-items:flex-end; gap:12px">
    <div class="cash" style="text-align:right"><small>PAY AND BONUS</small>+ ₹ 5,000</div>
    <div style="font-size:19px;color:var(--ink-dim)">SHO Rathi heard about it. <b style="color:var(--cop)">Standing +1</b></div>
  </div>

  <div class="next shadow-text">
    <span><span class="key dim">R</span>Replay</span>
    <span><span class="key" style="min-width:74px">Enter</span>Continue</span>
  </div>
</div>
<script>
(function(){
  const el = document.getElementById('stamps');
  // Perforated postage stamp outline
  const perf = (w, h, r, step) => {
    let d = `M${r},0`;
    for (let x = r; x < w - r; x += step) d += ` H${x + step/2 - r} a${r},${r} 0 0,0 ${2*r},0`;
    d += ` H${w} V${r}`;
    for (let y = r; y < h - r; y += step) d += ` V${y + step/2 - r} a${r},${r} 0 0,0 0,${2*r}`;
    d += ` V${h} H${w - r}`;
    for (let x = w - r; x > r; x -= step) d += ` H${x - step/2 + r} a${r},${r} 0 0,0 ${-2*r},0`;
    d += ` H0 V${h - r}`;
    for (let y = h - r; y > r; y -= step) d += ` V${y - step/2 + r} a${r},${r} 0 0,0 0,${-2*r}`;
    return d + ' Z';
  };
  const stamps = [
    { on: true, t: 'NO HARM', s: '0 civilians hurt', icon: '<path d="M56 30 c-6-8-18-4-18 5 c0 8 18 18 18 18 s18-10 18-18 c0-9-12-13-18-5z" fill="#0d1a29"/>' },
    { on: true, t: 'TWO WALLS', s: '2 barricades', icon: '<rect x="36" y="30" width="40" height="8" rx="2" fill="#0d1a29"/><rect x="36" y="42" width="40" height="8" rx="2" fill="#0d1a29"/>' },
    { on: false, t: 'UNDER 6:00', s: 'beat 06:00', icon: '<circle cx="56" cy="40" r="12" fill="none" stroke="rgba(246,239,228,.6)" stroke-width="3"/><path d="M56 40 V33" stroke="rgba(246,239,228,.6)" stroke-width="3" stroke-linecap="round"/>' },
  ];
  el.innerHTML = stamps.map(st => `<div class="stamp ${st.on ? '' : 'off'}">
    <svg width="112" height="132" viewBox="0 0 112 132"><path d="${perf(112, 132, 4, 14)}" fill="${st.on ? '#5aaeff' : 'rgba(0,0,0,.35)'}" stroke="${st.on ? 'none' : 'rgba(246,239,228,.35)'}" stroke-width="1.5"/>
      <rect x="8" y="8" width="96" height="116" rx="2" fill="none" stroke="${st.on ? 'rgba(13,26,41,.45)' : 'rgba(246,239,228,.18)'}" stroke-width="1.5"/>${st.icon}</svg>
    <div class="t">${st.t}<small>${st.s}</small></div></div>`).join('');
})();
</script>
</body></html>
