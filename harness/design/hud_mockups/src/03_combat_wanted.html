<!doctype html>
<html><head><meta charset="utf-8"><title>Kalesh HUD 03 combat and wanted</title>
<link rel="stylesheet" href="hud.css">
<style>
  .siren-rim { position: absolute; inset: -3px; border-radius: 25px; pointer-events: none;
    background: conic-gradient(from 200deg, rgba(255,59,54,.95), rgba(255,59,54,0) 30%, rgba(79,141,255,0) 50%, rgba(79,141,255,.95) 70%, rgba(255,59,54,0) 90%, rgba(255,59,54,.95));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; padding: 3px; }
  .hurt { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(0,0,0,0) 62%, rgba(140,0,0,0.38) 100%); }
  .dmg { position: absolute; left: 0; top: 0; }
  .search { position: absolute; right: 64px; top: 128px; font-size: 17px; color: var(--ink-dim); text-align: right; }
</style></head>
<body class="lead-driver">
<div class="stage">
  <img class="bg" src="../../reference/mood_east_delhi_night.jpg">
  <div class="edge-shade"></div>
  <div class="hurt"></div>

  <!-- Hit from the left: a damage arc on the screen edge -->
  <svg class="dmg" width="1920" height="1080">
    <defs><radialGradient id="dg" cx="0" cy="0.5" r="1"><stop offset="0" stop-color="#ff2a22" stop-opacity=".75"/><stop offset="1" stop-color="#ff2a22" stop-opacity="0"/></radialGradient></defs>
    <path d="M0 380 Q60 540 0 700 Z" fill="url(#dg)"/>
    <path d="M6 400 Q56 540 6 680" fill="none" stroke="#ff4a3a" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  </svg>

  <!-- Hostile markers: small red chevrons over heads -->
  <svg width="1920" height="1080" style="position:absolute;inset:0">
    <g fill="#ff3b36" stroke="#2a0705" stroke-width="2" style="filter:drop-shadow(0 0 6px rgba(255,59,54,.8))">
      <path d="M828 402 L852 402 L840 418 Z"/>
      <path d="M1038 398 L1062 398 L1050 414 Z"/>
    </g>
    <!-- Lock-on target: brackets, health pips -->
    <g transform="translate(1180,560)" fill="none" stroke="#f6efe4" stroke-width="3" stroke-linecap="round" style="filter:drop-shadow(0 0 4px rgba(0,0,0,.8))">
      <path d="M-86 -96 h-18 v28"/><path d="M86 -96 h18 v28"/><path d="M-86 136 h-18 v-28"/><path d="M86 136 h18 v-28"/>
    </g>
    <g transform="translate(1180,412)">
      <rect x="-50" y="0" width="100" height="7" rx="3.5" fill="rgba(0,0,0,.55)"/>
      <rect x="-50" y="0" width="28" height="7" rx="3.5" fill="#ff3b36"/>
      <path d="M-8 -22 L8 -22 L0 -10 Z" fill="#ff3b36" stroke="#2a0705" stroke-width="2"/>
    </g>
  </svg>

  <!-- Staggered: takedown prompt with a hold ring -->
  <div class="prompt shadow-text" style="left:1310px; top:520px">
    <div class="row">
      <div class="hold">
        <svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="23" fill="none" stroke="rgba(246,239,228,.25)" stroke-width="3"/>
          <circle cx="26" cy="26" r="23" fill="none" stroke="#f6efe4" stroke-width="3" stroke-dasharray="144.5" stroke-dashoffset="88" transform="rotate(-90 26 26)" stroke-linecap="round"/></svg>
        <span class="key" style="min-width:34px;height:34px;font-size:18px">E</span>
      </div>
      <span class="verb" style="font-size:24px">TAKEDOWN<small>Hold</small></span>
    </div>
  </div>
  <div class="combo shadow-text" style="left:1310px; top:610px; font-size:48px; color:#f6efe4">3<span style="font-size:24px; color:var(--ink-dim); margin-left:6px; letter-spacing:.12em">HITS</span></div>

  <!-- Lal Batti: wanted level, 3 of 5 -->
  <div class="wanted shadow-text">
    <div class="beacons" id="beacons"></div>
    <div class="label"><span>लाल बत्ती · LAL BATTI</span><span class="state">SEEN</span></div>
  </div>
  <div class="weapon glass" style="top:146px">
    <svg width="40" height="40" viewBox="0 0 40 40"><path d="M10 22 v-8 a3 3 0 0 1 6 0 v-2 a3 3 0 0 1 6 0 v1 a3 3 0 0 1 6 0 v3 a3 3 0 0 1 5 1 v9 q0 9 -10 9 h-4 q-9 0 -9 -8 z" fill="none" stroke="#f6efe4" stroke-width="2.4" stroke-linejoin="round"/></svg>
    <div class="name">FISTS<small>Brick ×1 · <b style="color:var(--ink)">G</b> to throw</small></div>
  </div>

  <!-- Objective tracker: mission objective changes in combat -->
  <div class="scrim" style="left:-120px;top:-40px;width:900px;height:300px"></div>
  <div class="tracker shadow-text">
    <div class="mission">Laxmi Nagar, after dark</div>
    <div class="goal"><em style="color:#ff6b5e">Shake off</em> Pappu's boys</div>
    <div class="sub">Police are coming. Lose them in the galis.</div>
  </div>

  <!-- Minimap with the search area and police -->
  <div class="minimap-wrap">
    <div class="minimap">
      <svg width="312" height="312" viewBox="0 0 312 312" id="mapsvg"></svg>
      <div class="north">N</div>
      <div class="vignette"></div>
      <div class="street shadow-text"><span class="dev">विकास मार्ग</span>Vikas Marg</div>
    </div>
    <div class="siren-rim"></div>
    <div class="vitals">
      <div class="vital-row"><span class="lbl" style="color:#ff6b5e">Health</span><div class="bar health low seg"><i style="width:34%"></i></div></div>
      <div class="vital-row"><span class="lbl">Gali</span><div class="bar skill"><i style="width:20%"></i></div></div>
    </div>
  </div>
</div>
<script>
(function(){
  const b = document.getElementById('beacons');
  const dome = on => `<svg class="beacon ${on ? 'on' : ''}" viewBox="0 0 42 42">
    ${on ? '<path d="M21 4 V9 M8 8 L11.5 12 M34 8 L30.5 12" stroke="#ff8a80" stroke-width="2.6" stroke-linecap="round"/><path d="M9 32 V24 Q9 15 21 15 Q33 15 33 24 V32 Z" fill="#ff3b36"/><rect x="5" y="32" width="32" height="6" rx="2" fill="#ff3b36"/><rect x="13" y="20" width="16" height="3.2" rx="1.6" fill="#ffd6cf" opacity=".9"/><rect x="11" y="26" width="20" height="2.6" rx="1.3" fill="#b3120e" opacity=".7"/>'
         : '<path d="M9 32 V24 Q9 15 21 15 Q33 15 33 24 V32 Z" fill="rgba(0,0,0,.35)" stroke="rgba(246,239,228,.45)" stroke-width="2"/><rect x="5" y="32" width="32" height="6" rx="2" fill="rgba(246,239,228,.35)"/>'}
  </svg>`;
  b.innerHTML = [1,1,1,0,0].map(dome).join('');
})();
(function(){
  const s = document.getElementById('mapsvg');
  let o = '<rect width="312" height="312" fill="#1a1411"/>';
  for (let y = -6; y < 320; y += 30) for (let x = -6; x < 320; x += 30) {
    if (Math.abs(x + 12 - 156) < 22) continue;
    o += `<rect x="${x}" y="${y}" width="24" height="24" rx="2" fill="#2b221c"/>`;
  }
  o += `<rect x="138" y="0" width="36" height="312" fill="#5d5146"/>`;           // Vikas Marg
  o += `<line x1="248" y1="0" x2="248" y2="312" stroke="#8a7e72" stroke-width="5" stroke-dasharray="10 6"/>`; // metro line
  // search circle tinted red
  o += `<circle cx="170" cy="170" r="118" fill="rgba(255,59,54,.16)" stroke="#ff3b36" stroke-width="2" stroke-dasharray="6 5"/>`;
  // police units: small beacon blips
  const cop = (x, y, a) => `<g transform="translate(${x},${y}) rotate(${a})"><path d="M0,-9 L7,7 L0,3 L-7,7 Z" fill="#4f8dff" stroke="#0b1530" stroke-width="1.5"/><circle cx="0" cy="-1" r="2.2" fill="#ff3b36"/></g>`;
  o += cop(156, 40, 180) + cop(232, 150, 250) + cop(70, 250, 30);
  // hostiles
  [[150,176],[166,170],[160,160]].forEach(([x,y]) => o += `<path d="M${x-5},${y-5} L${x+5},${y-5} L${x},${y+3} Z" fill="#ff3b36"/>`);
  // escape gali hint: a lane out of the circle
  o += `<path d="M138 210 H40 V312" fill="none" stroke="#6b5d50" stroke-width="7"/>`;
  // player
  o += `<g transform="translate(156,186)"><circle r="15" fill="#46d67c" opacity=".2"/><path d="M0,-12 L9,9 L0,4.5 L-9,9 Z" fill="#46d67c" stroke="#0d1f14" stroke-width="2" stroke-linejoin="round"/></g>`;
  s.innerHTML = o;
})();
</script>
</body></html>
